<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Shop</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #198754;
  color: white;
  text-align: center;
  padding: 25px;
}

nav {
  background: #222;
  padding: 15px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 12px;
}

.container {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.search {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-bottom: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.product {
  background: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
}

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
}

.price {
  color: #198754;
  font-weight: bold;
}

button {
  background: #198754;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
}

.cart {
  background: white;
  padding: 20px;
  margin-top: 25px;
  border-radius: 10px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
}

footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <h1>My Online Shop</h1>
  <p>Welcome to our online store</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#products">Products</a>
  <a href="#cart">My Cart</a>
</nav>

<div class="container">

  <input
    class="search"
    id="search"
    placeholder="Search products..."
    oninput="searchProducts()"
  >

  <h2 id="products">Our Products</h2>

  <div class="products" id="productList">

    <div class="product" data-name="shirt">
      <img src="https://placehold.co/300x200?text=Shirt" alt="Shirt">
      <h3>Men's Shirt</h3>
      <p class="price">৳500</p>
      <button onclick="addToCart('Men Shirt',500)">
        Add to Cart
      </button>
    </div>

    <div class="product" data-name="shoes">
      <img src="https://placehold.co/300x200?text=Shoes" alt="Shoes">
      <h3>Casual Shoes</h3>
      <p class="price">৳1200</p>
      <button onclick="addToCart('Casual Shoes',1200)">
        Add to Cart
      </button>
    </div>

    <div class="product" data-name="watch">
      <img src="https://placehold.co/300x200?text=Watch" alt="Watch">
      <h3>Smart Watch</h3>
      <p class="price">৳850</p>
      <button onclick="addToCart('Smart Watch',850)">
        Add to Cart
      </button>
    </div>

    <div class="product" data-name="bag">
      <img src="https://placehold.co/300x200?text=Bag" alt="Bag">
      <h3>Travel Bag</h3>
      <p class="price">৳700</p>
      <button onclick="addToCart('Travel Bag',700)">
        Add to Cart
      </button>
    </div>

  </div>

  <div class="cart" id="cart">
    <h2>🛒 Shopping Cart</h2>
    <div id="cartItems">Cart is empty</div>
    <h3 id="total">Total: ৳0</h3>

    <h2>Order Form</h2>
    <input id="customerName" placeholder="Your Name">
    <input id="customerPhone" placeholder="Phone Number">
    <textarea id="customerAddress" placeholder="Your Address"></textarea>

    <button onclick="placeOrder()">Place Order</button>
  </div>

</div>

<footer>
  <p>© 2026 My Online Shop</p>
</footer>

<script>
let cart = [];

function addToCart(name, price) {
  cart.push({name, price});
  showCart();
}

function showCart() {
  let items = document.getElementById("cartItems");
  let totalText = document.getElementById("total");
  items.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {
    total += item.price;

    let div = document.createElement("p");
    div.textContent = item.name + " - ৳" + item.price;

    let remove = document.createElement("button");
    remove.textContent = "Remove";
    remove.onclick = function() {
      cart.splice(index, 1);
      showCart();
    };

    div.appendChild(remove);
    items.appendChild(div);
  });

  if (cart.length === 0) {
    items.textContent = "Cart is empty";
  }

  totalText.textContent = "Total: ৳" + total;
}

function searchProducts() {
  let value = document.getElementById("search").value.toLowerCase();
  let products = document.querySelectorAll(".product");

  products.forEach(product => {
    let name = product.dataset.name;
    product.style.display = name.includes(value) ? "" : "none";
  });
}

function placeOrder() {
  let name = document.getElementById("customerName").value;
  let phone = document.getElementById("customerPhone").value;
  let address = document.getElementById("customerAddress").value;

  if (!name || !phone || !address || cart.length === 0) {
    alert("Please fill all information and add products.");
    return;
  }

  let message = "Order from My Online Shop%0A";
  message += "Name: " + encodeURIComponent(name) + "%0A";
  message += "Phone: " + encodeURIComponent(phone) + "%0A";
  message += "Address: " + encodeURIComponent(address) + "%0A";

  cart.forEach(item => {
    message += encodeURIComponent(item.name + " ৳" + item.price) + "%0A";
  });

  let total = cart.reduce((sum, item) => sum + item.price, 0);
  message += "Total: ৳" + total;

  alert("Your order form is ready. Connect a WhatsApp number to send it.");
}
</script>

</body>
  </html>
